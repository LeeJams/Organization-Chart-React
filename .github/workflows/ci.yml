name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        include:
          - node-version: 20.19.0
            react-version: 18.2.0
            react-types-version: 18.3.31
            react-dom-types-version: 18.3.7
          - node-version: 22.13.0
            react-version: 19.2.8
            react-types-version: 19.2.17
            react-dom-types-version: 19.2.3
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use React ${{ matrix.react-version }}
        run: npm install --no-save --package-lock=false react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }} @types/react@${{ matrix.react-types-version }} @types/react-dom@${{ matrix.react-dom-types-version }}

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check NodeNext consumers
        run: npm run check:consumer

      - name: Build demo
        run: npm run build-demo

      - name: Inspect package contents
        run: npm run check:pack
